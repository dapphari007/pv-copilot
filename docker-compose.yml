# Full stack: Milvus (etcd+minio+standalone) + FastAPI API + Streamlit + React.
#
#   docker compose up -d --build
#
# Prereqs: a built FAERS index under ./data (mounted into the API/Streamlit
# containers) and a .env file containing GROQ_API_KEY. Vector backend defaults
# to milvus here; the containers talk to the "standalone" service over the
# internal network.
name: pv-copilot

services:
  etcd:
    container_name: pv-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - ./milvus_volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: pv-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./milvus_volumes/minio:/minio_data
    command: minio server /minio_data

  standalone:
    container_name: pv-milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./milvus_volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on: [etcd, minio]

  api:
    container_name: pv-api
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://standalone:19530
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on: [standalone]

  streamlit:
    container_name: pv-streamlit
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://standalone:19530
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    depends_on: [standalone]

  frontend:
    container_name: pv-frontend
    build: ./frontend
    ports:
      - "5173:80"
    depends_on: [api]
